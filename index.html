<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rotina da Seção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: faixa azul-marinho de comando no topo, resumo em cartões sobrepostos,
   três painéis de situação e o quadro de trabalho (Kanban / Matriz de Eisenhower). */
:root {
  --bg: #edf0f5;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #0f1b2d;
  --ink-2: #39475b;
  --muted: #6a7588;
  --line: #dde3ec;
  --navy: #0b1f3a;
  --navy-2: #163259;
  --on-navy: #e8eef7;
  --on-navy-muted: #9fb1cb;
  --accent: #f2a900;
  --accent-ink: #1b1400;
  --blue: #2463c7;
  --ok: #18834e;
  --warn: #b8730a;
  --bad: #cf3a30;
  --idle: #8892a3;
  --shadow: 0 1px 2px rgba(15, 27, 45, .06), 0 8px 24px -12px rgba(15, 27, 45, .18);
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a111c; --surface: #111c2b; --surface-2: #162436; --ink: #e7edf6; --ink-2: #bcc7d6; --muted: #8796ab; --line: #24344a;
    --navy: #07152a; --navy-2: #102847; --accent: #f5b72a; --blue: #5d97f2; --ok: #3fbf7f; --warn: #e6a23c; --bad: #f06a5f; --idle: #7e8ba0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a111c; --surface: #111c2b; --surface-2: #162436; --ink: #e7edf6; --ink-2: #bcc7d6; --muted: #8796ab; --line: #24344a;
  --navy: #07152a; --navy-2: #102847; --accent: #f5b72a; --blue: #5d97f2; --ok: #3fbf7f; --warn: #e6a23c; --bad: #f06a5f; --idle: #7e8ba0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 36px); }

/* ---------- Faixa de comando ---------- */
.comando { background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); color: var(--on-navy); padding: 22px 0 76px; position: relative; overflow: hidden; }
.comando::after { content: ""; position: absolute; inset: auto 0 0 0; height: 4px; background: repeating-linear-gradient(90deg, var(--accent) 0 28px, transparent 28px 44px); opacity: .9; }
.comando .wrap { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-end; justify-content: space-between; }
.titulo { display: grid; gap: 4px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.eyebrow span + span::before { content: "/"; margin-right: 10px; color: var(--on-navy-muted); }
.titulo h1 { font-size: clamp(32px, 4.4vw, 46px); font-weight: 700; letter-spacing: .01em; line-height: 1; text-transform: uppercase; }
.ref { color: var(--on-navy-muted); font-size: 14.5px; max-width: 72ch; border-radius: 6px; padding: 2px 6px; margin-left: -6px; outline: none; }
.ref:hover, .ref:focus { background: rgba(255,255,255,.08); color: var(--on-navy); }
.ref:empty::before { content: "Clique para escrever a referência (ex.: rotina da semana feita pela encarregada)"; opacity: .6; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.salvo { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--on-navy-muted); margin-right: 6px; }
.salvo i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(63,191,127,.2); }
.salvo.pend i { background: var(--accent); box-shadow: 0 0 0 3px rgba(242,169,0,.22); }
.btn { display: inline-flex; align-items: center; gap: 7px; border-radius: 9px; padding: 9px 14px; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--blue); }
.btn:active { transform: translateY(1px); }
.btn.claro { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.18); color: var(--on-navy); }
.btn.claro:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.32); }
.btn.sinal { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sinal:hover { filter: brightness(1.06); }
.btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.perigo { color: var(--bad); }
.btn.perigo.armado { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.so-icone { padding: 9px; }

/* ---------- Resumo ---------- */
main.wrap { margin-top: -54px; position: relative; display: grid; gap: 20px; padding-bottom: 56px; }
.resumo-grid { display: grid; grid-template-columns: minmax(240px, 300px) 1fr; gap: 14px; }
@media (max-width: 860px) { .resumo-grid { grid-template-columns: 1fr; } }
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.geral { padding: 18px 20px; display: flex; gap: 18px; align-items: center; }
.anel { position: relative; width: 104px; height: 104px; flex: none; }
.anel svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anel b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.geral h2 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.geral p { font-size: 22px; font-weight: 600; font-family: var(--font-display); }
.geral small { color: var(--muted); font-size: 13px; display: block; margin-top: 2px; }
.status-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; padding: 4px 0; }
@media (max-width: 1100px) { .status-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.st { padding: 14px 18px; display: grid; gap: 6px; grid-template-rows: 1fr auto; align-items: end; border-left: 1px solid var(--line); text-align: left; background: none; border-top: 0; border-right: 0; border-bottom: 0; }
.status-grid > :first-child { border-left: 0; }
@media (max-width: 1100px) { .st { border-left: 0; border-top: 1px solid var(--line); } .status-grid > :nth-child(-n+3) { border-top: 0; } }
.st span { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); font-weight: 500; }
.st span::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.st b { font-family: var(--font-display); font-size: 36px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.st.ativo { background: var(--surface-2); }

/* ---------- Painéis ---------- */
.paineis { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1.05fr); gap: 14px; align-items: start; }
@media (max-width: 1120px) { .paineis { grid-template-columns: 1fr 1fr; } .p-atencao { grid-column: 1 / -1; } }
@media (max-width: 700px) { .paineis { grid-template-columns: 1fr; } }
.painel { padding: 16px 18px 18px; display: grid; gap: 12px; }
.painel-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.painel-cab h2 { font-size: 19px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.painel-cab h2 .i { color: var(--muted); }
.contador { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alerta { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.alerta:hover { border-color: var(--c); }
.alerta .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.alerta .ic .i { width: 18px; height: 18px; }
.alerta em { font-style: normal; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--c); font-weight: 600; }
.alerta strong { display: block; font-weight: 600; font-size: 14.5px; line-height: 1.3; margin-top: 1px; }
.alerta p { color: var(--muted); font-size: 13px; margin-top: 2px; }
.notas { width: 100%; border: 1px dashed var(--line); border-radius: 10px; padding: 9px 11px; background: transparent; resize: vertical; min-height: 44px; font-size: 14px; }
.notas:focus { outline: none; border-style: solid; border-color: var(--blue); background: var(--surface-2); }
.vazio { color: var(--muted); font-size: 14px; padding: 6px 2px; }

.agenda { position: relative; }
.agenda li { position: relative; padding-left: 22px; }
.agenda li::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: -14px; width: 2px; background: var(--line); }
.agenda li:last-child::before { display: none; }
.agenda li::after { content: ""; position: absolute; left: 0; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--blue); }
.agenda li.hoje::after { background: var(--accent); border-color: var(--accent); }
.agenda button { display: grid; gap: 2px; text-align: left; background: none; border: 0; padding: 0 0 10px; width: 100%; }
.agenda time { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--blue); display: flex; gap: 8px; align-items: center; }
.agenda .hoje time { color: var(--warn); }
.agenda .tag-hoje { font-size: 10px; letter-spacing: .08em; background: var(--accent); color: var(--accent-ink); padding: 1px 6px; border-radius: 4px; }
.agenda strong { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.agenda button:hover strong { text-decoration: underline; text-underline-offset: 3px; }
.agenda span.quem { font-size: 13px; color: var(--muted); }

.efetivo li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 4px 0; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .02em; background: var(--surface-2); border: 2px solid var(--c); color: var(--ink-2); }
.efetivo .nome { font-weight: 600; font-size: 14.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.efetivo .obs { grid-column: 2 / -1; border: 0; background: transparent; font-size: 12.5px; color: var(--muted); padding: 0 0 2px; border-bottom: 1px dashed transparent; margin-top: -4px; }
.efetivo .obs:hover { border-bottom-color: var(--line); }
.efetivo .obs:focus { outline: none; border-bottom-color: var(--blue); color: var(--ink); }
.sit { appearance: none; -webkit-appearance: none; border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 12%, var(--surface)); color: var(--ink); border-radius: 99px; padding: 4px 26px 4px 11px; font-size: 12.5px; font-weight: 600; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 12px top 52%, right 8px top 52%; background-size: 4px 4px; background-repeat: no-repeat; }
.link { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; justify-self: start; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Quadro ---------- */
.quadro-cab { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; margin-top: 6px; }
.abas { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 4px; gap: 4px; box-shadow: var(--shadow); }
.abas button { border: 0; background: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 7px; align-items: center; }
.abas button[aria-selected="true"] { background: var(--navy); color: #fff; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filtros select { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--surface); font-size: 14px; }
.filtros .limpar { font-size: 13px; }
.dica { font-size: 12.5px; color: var(--muted); }

.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(236px, 1fr); gap: 12px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x proximity; }
.coluna { min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; scroll-snap-align: start; min-height: 220px; }
.coluna > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px 8px; border-bottom: 3px solid var(--c); }
.coluna h3 { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
.coluna h3::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.zona > * { min-width: 0; }
.zona { padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 9px; align-content: start; flex: 1; border-radius: 0 0 var(--r) var(--r); transition: background .15s; }
.zona.sobre { background: color-mix(in srgb, var(--blue) 9%, transparent); box-shadow: inset 0 0 0 2px var(--blue); }
.zona .vazio { text-align: center; padding: 18px 6px; border: 1px dashed var(--line); border-radius: 10px; font-size: 13px; }

.card { grid-template-columns: minmax(0, 1fr); position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px 11px 15px; display: grid; gap: 7px; cursor: grab; text-align: left; box-shadow: 0 1px 2px rgba(15,27,45,.05); transition: border-color .15s, box-shadow .15s, transform .15s; }
.card::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--faixa); }
.card:hover { border-color: color-mix(in srgb, var(--blue) 50%, var(--line)); box-shadow: var(--shadow); }
.card.arrastando { opacity: .4; transform: rotate(-1.5deg); }
.card-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.cat { flex: 1 1 auto; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.prio { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; color: var(--qc); background: color-mix(in srgb, var(--qc) 13%, transparent); white-space: nowrap; flex: none; letter-spacing: .02em; }
.card h4 { font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--ink); }
.card p.det { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--ink-2); }
.meta span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.meta .i { width: 13px; height: 13px; color: var(--muted); }
.meta .prazo { font-family: var(--font-mono); font-size: 11.5px; }
.risco { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; font-weight: 600; color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, transparent); border-radius: 7px; padding: 5px 8px; }
.risco .i { width: 14px; height: 14px; margin-top: 1px; }
.card a.abrir { font-size: 12.5px; color: var(--blue); font-weight: 600; display: inline-flex; gap: 5px; align-items: center; justify-self: start; text-decoration: none; }
.card a.abrir:hover { text-decoration: underline; }
.card a.abrir .i { width: 13px; height: 13px; }
.card.feito { padding: 9px 12px 9px 15px; gap: 3px; background: color-mix(in srgb, var(--surface) 70%, var(--surface-2)); }
.card.feito h4 { font-size: 13.5px; font-weight: 500; color: var(--ink-2); display: flex; gap: 7px; }
.card.feito h4 .i { color: var(--ok); width: 15px; height: 15px; margin-top: 2px; }
.card.feito .meta { font-size: 11.5px; color: var(--muted); padding-left: 22px; }

.matriz { display: grid; grid-template-columns: 30px 1fr 1fr; grid-template-rows: auto 1fr 1fr auto; gap: 12px; }
.eixo { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; }
.eixo.v { writing-mode: vertical-rl; transform: rotate(180deg); }
.quad { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 200px; overflow: hidden; box-shadow: var(--shadow); }
.quad > header { padding: 12px 14px; background: color-mix(in srgb, var(--qc) 10%, var(--surface)); border-bottom: 1px solid color-mix(in srgb, var(--qc) 25%, var(--line)); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.quad h3 { font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; display: flex; gap: 10px; align-items: baseline; }
.quad h3 em { font-style: normal; font-family: var(--font-mono); font-size: 12px; color: var(--qc); font-weight: 600; }
.quad header small { font-size: 12.5px; color: var(--muted); display: block; margin-top: 1px; }
.quad .zona { grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); }
.sem-q { grid-column: 2 / -1; }
.sem-q > header { background: var(--surface-2); }
@media (max-width: 780px) {
  .matriz { grid-template-columns: 1fr; }
  .eixo { display: none; }
  .sem-q { grid-column: auto; }
}

/* ---------- Estado vazio ---------- */
.inicio { max-width: 560px; margin: 0 auto; padding: 36px 28px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.inicio .ic { width: 56px; height: 56px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; color: var(--blue); }
.inicio .ic .i { width: 26px; height: 26px; }
.inicio h2 { font-size: 26px; text-transform: uppercase; }
.inicio p { color: var(--muted); }
.inicio .acoes { justify-content: center; }

/* ---------- Modal ---------- */
.fundo { position: fixed; inset: 0; background: rgba(6, 13, 25, .6); backdrop-filter: blur(2px); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; z-index: 20; overflow-y: auto; }
.modal { background: var(--surface); color: var(--ink); border-radius: 16px; border: 1px solid var(--line); width: min(640px, 100%); display: grid; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); overflow: hidden; }
.modal > header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modal > header h2 { font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.modal .corpo { padding: 18px 20px; display: grid; gap: 14px; }
.modal > footer { padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.modal > footer div { display: flex; gap: 8px; flex-wrap: wrap; }
.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.campos label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.campos .full { grid-column: 1 / -1; }
.campos input, .campos select, .campos textarea, .caixa-texto { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--bg); color: var(--ink); font-size: 15px; width: 100%; text-transform: none; letter-spacing: 0; font-weight: 400; }
.campos input:focus, .campos select:focus, .campos textarea:focus, .caixa-texto:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent); }
.campos textarea { min-height: 76px; resize: vertical; }
.caixa-texto { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; min-height: 340px; resize: vertical; }
.opcoes { display: grid; gap: 8px; }
.opcao { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; background: var(--surface); }
.opcao:hover { border-color: var(--blue); background: var(--surface-2); }
.opcao .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--blue); }
.opcao strong { display: block; font-size: 15px; }
.opcao small { color: var(--muted); font-size: 13px; }
.msg { font-size: 13px; color: var(--muted); }
.msg.erro { color: var(--bad); }
@media (max-width: 560px) { .campos { grid-template-columns: 1fr; } .comando { padding-bottom: 70px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .comando { background: none; color: #000; padding: 0 0 12px; }
  .comando::after, .acoes, .quadro-cab .filtros, .dica, .link, .notas:placeholder-shown { display: none; }
  main.wrap { margin-top: 0; }
  .kanban { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); overflow: visible; }
  .cartao, .card, .quad { box-shadow: none; }
}

<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  /* ================= Configuração ================= */
  var ARQUIVO = 'dados.json';             // arquivo com as tarefas, ao lado deste index.html
  var CHAVE_LOCAL = 'rotina-secao:v2';    // edições ficam salvas neste navegador

  var STATUS = [
    { id: 'afazer', nome: 'A fazer', cor: 'var(--idle)' },
    { id: 'andamento', nome: 'Em andamento', cor: 'var(--blue)' },
    { id: 'aguardando', nome: 'Aguardando terceiros', cor: 'var(--warn)' },
    { id: 'impedido', nome: 'Impedido', cor: 'var(--bad)' },
    { id: 'concluido', nome: 'Concluído', cor: 'var(--ok)' }
  ];
  var QUAD = [
    { id: 'q1', curto: 'Fazer agora', nome: 'Fazer agora', sub: 'Urgente e importante', cor: 'var(--bad)' },
    { id: 'q2', curto: 'Agendar', nome: 'Agendar', sub: 'Importante, não urgente', cor: 'var(--blue)' },
    { id: 'q3', curto: 'Delegar', nome: 'Delegar ou acompanhar', sub: 'Urgente, menos importante', cor: 'var(--warn)' },
    { id: 'q4', curto: 'Adiar', nome: 'Adiar ou eliminar', sub: 'Nem urgente nem importante', cor: 'var(--idle)' }
  ];
  var SITUACOES = ['Na seção', 'SALOP', 'RISAER', 'Férias', 'Missão', 'Saúde', 'Dispensa', 'Outro'];

  /* ================= Ícones ================= */
  var ICONES = {
    alerta: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    pare: '<path d="M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9z"/><path d="M15 9l-6 6M9 9l6 6"/>',
    ampulheta: '<path d="M5 22h14M5 2h14M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4a2 2 0 0 0-.6 1.4V22M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4a2 2 0 0 0 .6-1.4V2"/>',
    pessoa: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    pessoas: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>',
    relogio: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    mais: '<path d="M12 5v14M5 12h14"/>',
    doc: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
    baixar: '<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
    subir: '<path d="M12 21V9M7 14l5-5 5 5M4 3h16"/>',
    agenda: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    kanban: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/>',
    matriz: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18"/>',
    banco: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
    copiar: '<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
    voltar: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    lixo: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'
  };
  function ic(nome) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'i'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICONES[nome] || '';
    return s;
  }

  /* ================= Utilidades ================= */
  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'style') e.setAttribute('style', v);
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    (kids || []).forEach(function (c) {
      if (c == null || c === false) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function statusDe(id) { for (var i = 0; i < STATUS.length; i++) if (STATUS[i].id === id) return STATUS[i]; return STATUS[0]; }
  function quadDe(id) { for (var i = 0; i < QUAD.length; i++) if (QUAD[i].id === id) return QUAD[i]; return null; }
  function aberta(t) { return t.status !== 'concluido'; }
  function presente(m) { return m.situacao === 'Na seção'; }
  function corSit(s) { return s === 'Na seção' ? 'var(--ok)' : s === 'Saúde' ? 'var(--bad)' : (s === 'Férias' || s === 'Dispensa') ? 'var(--idle)' : 'var(--warn)'; }
  function iniciais(nome) {
    var p = String(nome || '').replace(/\(.*?\)/g, '').trim().split(/\s+/).filter(Boolean);
    p = p.filter(function (x) { return !/^(1S|2S|3S|SO|CB|SD|Ten|Cap|Maj|Cel|Civil)$/i.test(x); });
    if (!p.length) return '?';
    return (p[0][0] + (p[1] ? p[1][0] : (p[0][1] || ''))).toUpperCase();
  }
  function fora(t) {
    var r = norm(t.resp);
    if (!r || !aberta(t)) return [];
    return state.efetivo.filter(function (m) { return !presente(m) && m.chave && r.indexOf(norm(m.chave)) >= 0; });
  }
  function hoje() {
    try { return new Date().toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit' }); } catch (e) { return ''; }
  }
  function dataHora(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    try { return d.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(',', ' às'); }
    catch (e) { return d.toLocaleString(); }
  }
  function novoId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function porPrioridade(a, b) { return (a.quadrante || 'q9').localeCompare(b.quadrante || 'q9'); }
  function linkSeguro(u) { u = String(u || '').trim(); if (!u) return ''; if (!/^https?:\/\//i.test(u)) u = 'https://' + u; return u; }

  /* ================= Dados ================= */
  function texto(v) { return typeof v === 'string' ? v : v == null ? '' : String(v); }
  function normalizar(o) {
    if (!o || typeof o !== 'object') return null;
    var tar = Array.isArray(o.tarefas) ? o.tarefas : [], efe = Array.isArray(o.efetivo) ? o.efetivo : [];
    if (!tar.length && !efe.length) return null;
    var stIds = STATUS.map(function (s) { return s.id; }), qIds = ['', 'q1', 'q2', 'q3', 'q4'];
    var at = texto(o.atualizado);
    return {
      atualizado: isNaN(new Date(at)) ? new Date().toISOString() : at,
      subtitulo: texto(o.subtitulo),
      notas: texto(o.notas),
      efetivo: efe.filter(function (m) { return m && texto(m.nome).trim(); }).map(function (m) {
        return { id: texto(m.id) || novoId('e'), nome: texto(m.nome).trim(), chave: texto(m.chave).trim(), situacao: SITUACOES.indexOf(texto(m.situacao)) >= 0 ? texto(m.situacao) : 'Outro', obs: texto(m.obs) };
      }),
      tarefas: tar.filter(function (t) { return t && typeof t === 'object'; }).map(function (t) {
        var st = stIds.indexOf(texto(t.status)) >= 0 ? texto(t.status) : 'afazer';
        var n = { id: texto(t.id) || novoId('t'), titulo: texto(t.titulo).trim() || 'Sem título', categoria: texto(t.categoria), detalhe: texto(t.detalhe), resp: texto(t.resp), prazo: texto(t.prazo), status: st, quadrante: qIds.indexOf(texto(t.quadrante)) >= 0 ? texto(t.quadrante) : '', link: /^https?:\/\//i.test(texto(t.link)) ? texto(t.link) : '' };
        if (st === 'concluido' && texto(t.concluidoEm)) n.concluidoEm = texto(t.concluidoEm);
        return n;
      })
    };
  }
  function paraArquivo() { return { atualizado: state.atualizado, subtitulo: state.subtitulo, notas: state.notas, efetivo: state.efetivo, tarefas: state.tarefas }; }

  var state = null;            // dados em uso
  var doArquivo = null;        // como está no dados.json publicado
  var aba = location.hash === '#matriz' ? 'matriz' : 'kanban';
  var filtroResp = '', filtroCat = '', filtroStatus = '';
  var arrastando = null;

  function lerLocal() { try { return normalizar(JSON.parse(localStorage.getItem(CHAVE_LOCAL) || 'null')); } catch (e) { return null; } }
  function salvarLocal() { try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify(paraArquivo())); return true; } catch (e) { return false; } }
  function mudou() {
    state.atualizado = new Date().toISOString();
    salvarLocal();
    render();
  }
  function diferenteDoArquivo() {
    if (!state) return false;
    if (!doArquivo) return true;
    return JSON.stringify(paraArquivo()) !== JSON.stringify({ atualizado: doArquivo.atualizado, subtitulo: doArquivo.subtitulo, notas: doArquivo.notas, efetivo: doArquivo.efetivo, tarefas: doArquivo.tarefas });
  }

  function carregar() {
    var local = lerLocal();
    function escolher(arq) {
      doArquivo = arq;
      if (local && (!arq || new Date(local.atualizado) >= new Date(arq.atualizado))) state = local;
      else state = arq ? JSON.parse(JSON.stringify(arq)) : null;
      render();
    }
    if (!window.fetch || location.protocol === 'file:') { escolher(null); return; }
    fetch(ARQUIVO + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { escolher(normalizar(j)); }, function () { escolher(null); });
  }

  /* ================= Topo ================= */
  function comando() {
    var pend = diferenteDoArquivo();
    var ref = h('div', { class: 'ref', contenteditable: state ? 'true' : 'false', spellcheck: 'false', title: 'Clique para editar', text: state ? state.subtitulo : '' });
    ref.addEventListener('blur', function () { var v = ref.textContent.trim(); if (state && v !== state.subtitulo) { state.subtitulo = v; mudou(); } });
    ref.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); ref.blur(); } });
    return h('header', { class: 'comando' }, [h('div', { class: 'wrap' }, [
      h('div', { class: 'titulo' }, [
        h('div', { class: 'eyebrow' }, [h('span', { text: 'Painel de acompanhamento' }), state ? h('span', { text: 'Atualizado em ' + dataHora(state.atualizado) }) : null]),
        h('h1', { text: 'Rotina da Seção' }),
        state ? ref : null
      ]),
      state ? h('div', { class: 'acoes' }, [
        h('span', { class: 'salvo' + (pend ? ' pend' : ''), title: pend ? 'As mudanças estão salvas neste navegador. Para atualizar o site, baixe o dados.json e suba no GitHub.' : 'Igual ao dados.json publicado.' }, [h('i'), pend ? 'Salvo neste navegador' : 'Igual ao publicado']),
        h('button', { class: 'btn claro', type: 'button', onclick: abrirDados }, [ic('banco'), 'Dados']),
        h('button', { class: 'btn claro', type: 'button', onclick: abrirResumo }, [ic('doc'), 'Resumo para a chefia']),
        h('button', { class: 'btn sinal', type: 'button', onclick: function () { abrirEdicao(null); } }, [ic('mais'), 'Nova tarefa'])
      ]) : null
    ])]);
  }

  /* ================= Resumo ================= */
  function anel(pct) {
    var r = 44, c = 2 * Math.PI * r;
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 104 104');
    svg.innerHTML = '<circle cx="52" cy="52" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="10"/>' +
      '<circle cx="52" cy="52" r="' + r + '" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (c * pct / 100) + ' ' + c + '"/>';
    return h('div', { class: 'anel', role: 'img', 'aria-label': pct + '% concluído' }, [svg, h('b', { text: pct + '%' })]);
  }
  function resumo() {
    var cont = {}; STATUS.forEach(function (s) { cont[s.id] = 0; });
    state.tarefas.forEach(function (t) { cont[t.status]++; });
    var total = state.tarefas.length, pct = total ? Math.round(cont.concluido / total * 100) : 0;
    var pres = state.efetivo.filter(presente).length;
    var tiles = STATUS.map(function (s) {
      return h('button', { type: 'button', class: 'st' + (filtroStatus === s.id ? ' ativo' : ''), style: '--c:' + s.cor, title: 'Mostrar só "' + s.nome + '" no quadro', 'aria-pressed': filtroStatus === s.id ? 'true' : 'false',
        onclick: function () { filtroStatus = filtroStatus === s.id ? '' : s.id; aba = 'kanban'; render(); } }, [h('span', { text: s.nome }), h('b', { text: String(cont[s.id]) })]);
    });
    tiles.push(h('div', { class: 'st', style: '--c:var(--ok)' }, [h('span', { text: 'Efetivo na seção' }), h('b', { text: pres + '/' + state.efetivo.length })]));
    return h('section', { class: 'resumo-grid', 'aria-label': 'Resumo' }, [
      h('div', { class: 'cartao geral' }, [anel(pct), h('div', {}, [
        h('h2', { text: 'Andamento geral' }),

        h('small', { text: (total - cont.concluido) + ' em aberto · ' + cont.impedido + ' impedida' + (cont.impedido === 1 ? '' : 's') })
      ])]),
      h('div', { class: 'cartao status-grid' }, tiles)
    ]);
  }

  /* ================= Painéis ================= */
  function cabPainel(icone, titulo, contador) {
    return h('div', { class: 'painel-cab' }, [h('h2', {}, [ic(icone), titulo]), contador != null ? h('span', { class: 'contador', text: contador }) : null]);
  }
  function atencao() {
    var itens = [];
    state.tarefas.filter(aberta).forEach(function (t) {
      if (t.status === 'impedido') itens.push({ t: t, o: 0, tipo: 'Impedido', cor: 'var(--bad)', icone: 'pare', txt: t.detalhe });
      var f = fora(t);
      if (f.length) itens.push({ t: t, o: 1, tipo: 'Em risco', cor: 'var(--bad)', icone: 'alerta', txt: f.map(function (m) { return m.nome + ': ' + m.situacao + (m.obs ? ' (' + m.obs + ')' : ''); }).join('; ') });
      if (t.status === 'aguardando') itens.push({ t: t, o: 2, tipo: 'Aguardando', cor: 'var(--warn)', icone: 'ampulheta', txt: (t.resp ? 'Com: ' + t.resp + '. ' : '') + (t.detalhe || '') });
    });
    itens.sort(function (a, b) { return a.o - b.o; });
    var notas = h('textarea', { class: 'notas', id: 'notas', rows: '2', placeholder: 'Observações para a chefia (entram no resumo)', 'aria-label': 'Observações para a chefia' });
    notas.value = state.notas || '';
    notas.addEventListener('change', function () { state.notas = notas.value; mudou(); });
    return h('section', { class: 'cartao painel p-atencao' }, [
      cabPainel('alerta', 'Pontos de atenção', itens.length + (itens.length === 1 ? ' item' : ' itens')),
      itens.length ? h('ul', { class: 'lista' }, itens.map(function (i) {
        return h('li', {}, [h('button', { type: 'button', class: 'alerta', style: '--c:' + i.cor, onclick: function () { abrirEdicao(i.t.id); } }, [
          h('span', { class: 'ic' }, [ic(i.icone)]),
          h('span', {}, [h('em', { text: i.tipo }), h('strong', { text: i.t.titulo }), i.txt ? h('p', { text: i.txt }) : null])
        ])]);
      })) : h('p', { class: 'vazio', text: 'Nada impedido, em risco ou aguardando.' }),
      notas
    ]);
  }
  function agenda() {
    var hj = hoje();
    var reun = state.tarefas.filter(function (t) { return aberta(t) && norm(t.categoria) === 'reunioes'; });
    reun.sort(function (a, b) { return (b.prazo.indexOf(hj) === 0) - (a.prazo.indexOf(hj) === 0); });
    return h('section', { class: 'cartao painel' }, [
      cabPainel('agenda', 'Agenda', reun.length + (reun.length === 1 ? ' reunião' : ' reuniões')),
      reun.length ? h('ul', { class: 'lista agenda' }, reun.map(function (t) {
        var ehHoje = hj && t.prazo.indexOf(hj) === 0;
        return h('li', { class: ehHoje ? 'hoje' : '' }, [h('button', { type: 'button', onclick: function () { abrirEdicao(t.id); } }, [
          h('time', {}, [t.prazo || 'Sem data', ehHoje ? h('span', { class: 'tag-hoje', text: 'HOJE' }) : null]),
          h('strong', { text: t.titulo }),
          t.resp ? h('span', { class: 'quem', text: t.resp }) : null
        ])]);
      })) : h('p', { class: 'vazio', text: 'Sem reuniões em aberto. Use a categoria "Reuniões" para aparecerem aqui.' })
    ]);
  }
  function efetivo() {
    var pres = state.efetivo.filter(presente).length;
    return h('section', { class: 'cartao painel' }, [
      cabPainel('pessoas', 'Efetivo hoje', pres + ' de ' + state.efetivo.length + ' na seção'),
      state.efetivo.length ? h('ul', { class: 'lista efetivo' }, state.efetivo.map(function (m) {
        var sel = h('select', { class: 'sit', id: 'sit-' + m.id, 'aria-label': 'Situação de ' + m.nome, style: '--c:' + corSit(m.situacao) }, SITUACOES.map(function (s) { return h('option', { value: s, text: s }); }));
        sel.value = m.situacao;
        sel.addEventListener('change', function () { m.situacao = sel.value; mudou(); });
        var obs = h('input', { class: 'obs', id: 'obs-' + m.id, type: 'text', placeholder: '+ observação', 'aria-label': 'Observação de ' + m.nome });
        obs.value = m.obs || '';
        obs.addEventListener('change', function () { m.obs = obs.value; mudou(); });
        return h('li', {}, [h('span', { class: 'av', style: '--c:' + corSit(m.situacao), text: iniciais(m.nome) }), h('span', { class: 'nome', text: m.nome, title: m.nome }), sel, obs]);
      })) : h('p', { class: 'vazio', text: 'Nenhum militar cadastrado.' }),
      h('button', { type: 'button', class: 'link', onclick: abrirEfetivo }, [ic('pessoa'), 'Incluir ou remover militar'])
    ]);
  }

  /* ================= Quadro ================= */
  function filtrada(t) {
    if (filtroResp && norm(t.resp).indexOf(norm(filtroResp)) < 0) return false;
    if (filtroCat && t.categoria !== filtroCat) return false;
    if (filtroStatus && aba === 'kanban' && t.status !== filtroStatus) return false;
    return true;
  }
  function categorias() {
    var s = {}; state.tarefas.forEach(function (t) { if (t.categoria) s[t.categoria] = 1; });
    return Object.keys(s).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
  }

  window.addEventListener('storage', function (e) { if (e.key === CHAVE_LOCAL) { var l = lerLocal(); if (l) { state = l; render(); } } });
  render();
  carregar();
})();
</script>
